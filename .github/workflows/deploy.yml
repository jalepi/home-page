name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # Optional repository secrets (Settings > Secrets and variables >
          # Actions > Secrets). A link only appears on the site if it is set.
          SOCIAL_LINKEDIN: ${{ secrets.SOCIAL_LINKEDIN }}
          SOCIAL_GITHUB: ${{ secrets.SOCIAL_GITHUB }}
          SOCIAL_X: ${{ secrets.SOCIAL_X }}
          SOCIAL_YOUTUBE: ${{ secrets.SOCIAL_YOUTUBE }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
